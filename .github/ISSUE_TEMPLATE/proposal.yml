name: Design / feature proposal
description: Propose a scoped Care Operations capability or architecture change
title: "[Proposal] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Operational problem
      description: Describe the human-operation problem before proposing a feature.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Why this belongs in the Last-mile boundary
      description: Explain why this is Case Operations rather than upstream monitoring or generic platform work.
    validations:
      required: true
  - type: textarea
    id: invariant
    attributes:
      label: Invariants affected
      description: Ownership, completion, tenant, auth, persistence, replay, AI boundary, etc.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Prefer observable and testable criteria.
    validations:
      required: true
  - type: textarea
    id: out
    attributes:
      label: Out of scope
      description: Adjacent work that should not be pulled into this proposal.
